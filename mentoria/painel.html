<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel · Mentoria Estrela</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A1640">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
.seletor-turma{background:transparent;border:1px solid #6E5590;color:var(--lilas-claro);border-radius:20px;padding:6px 10px;font-size:14px}
.seletor-turma option{color:#222}
.vivo-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0 24px}
.vivo-card{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:12px;text-decoration:none;display:block}
.vivo-card:hover{border-color:var(--rosa)}
.vivo-card .nome{font-weight:500}
.vivo-card .st{font-size:12px;color:var(--suave)}
.vivo-card svg{width:100%;max-width:190px;display:block;margin:6px auto 0}
.vivo-card .res{font-size:13px;margin-top:6px;max-height:160px;overflow:hidden;color:var(--tinta)}
.vivo-ex{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.vivo-ex h3{flex:1}
.sel-sessao{padding:9px 12px;border:1px solid var(--linha);border-radius:12px;background:#fff;font-size:15px}
.anot textarea{width:100%;min-height:120px;border:1px solid #D8C9E8;border-radius:10px;padding:10px;font-size:15px;background:#FCFAFF}
.anot{background:#F1EAF8;border-radius:14px;padding:12px 14px;margin:14px 0}
.anot label{font:500 22px/1 Caveat,cursive;color:var(--roxo);display:block;margin-bottom:6px}
/* espelho: a tela do participante, em formato de celular, ao lado */
#espelho{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:60;display:flex;flex-direction:column;background:#2A1640;border-left:1px solid #E6D3C4;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
#espelho[hidden]{display:none}
.esp-barra{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#1E0F30;color:#F3E9FF}
.esp-tit{flex:1;min-width:0;display:grid;font-size:13px;line-height:1.3}
.esp-tit b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.esp-tit span{color:#D9BF85}
.esp-seguir{display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;cursor:pointer}
.esp-seguir input{accent-color:#B8924A;width:16px;height:16px}
.esp-x{background:none;border:0;color:#F3E9FF;font-size:26px;line-height:1;width:36px;height:36px;cursor:pointer}
.esp-tela{flex:1;overflow:auto;padding:14px 14px 40px;background:#F7F1E6;color:var(--tinta)}
.esp-tela .cabeca{text-align:center}
.esp-tela .cabeca h1{font:600 24px/1.1 'Cormorant Garamond',Georgia,serif;color:#4B2A6B}
.esp-tela .cabeca .sub{color:#8A6A24}
.esp-tela input:disabled,.esp-tela textarea:disabled,.esp-tela select:disabled{opacity:1;color:var(--tinta);-webkit-text-fill-color:var(--tinta);background:#fff}
.esp-tela .maas-voltar{pointer-events:none;opacity:.5}
.esp-mini{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--roxo);border:1px solid var(--linha);border-radius:20px;padding:4px 10px;background:#fff}
@media (min-width:900px){body.com-espelho main,body.com-espelho .topo-painel,body.com-espelho .abas{margin-right:440px}}
</style>
</head>
<body class="atelie">
<header class="topo-painel">
  <img src="logo.jpg" alt="">
  <div><b>Mentoria Estrela</b><span>painel da Geovana</span></div>
  <div class="dir"><select class="seletor-turma" id="selTurma" hidden aria-label="Turma"></select><button class="link" id="bSair" hidden>sair</button></div>
</header>
<nav class="abas" id="abas" hidden>
  <a href="#aovivo" data-aba="aovivo">Aula ao vivo</a>
  <a href="#" data-aba="alunos">Participantes</a>
  <a href="#liberar" data-aba="liberar">Liberar</a>
  <a href="#turmas" data-aba="turmas">Turmas</a>
</nav>
<main id="app"><p class="miudo">Carregando…</p></main>

<script src="js/supabase-2.45.4.js"></script>
<script src="js/comum.js"></script>
<script src="js/maas.js"></script>
<script>
(function () {
  var app = $('#app');
  var turmas = [], alunos = [], sessoes = [], sessoesTodas = [], exercicios = [], libs = [], respostas = {}, comentarios = {}, anotacoes = {}, logins = {};
  var turmaId = null, vivoTimer = null, sessaoVivo = null;
  var LINK = location.origin + location.pathname.replace(/painel\.html$/, '');
  var tmp = supabase.createClient(CONFIG.url, CONFIG.chave, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'cadastro-tmp' } });

  function toast(t) {
    var d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
    document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600);
  }
  function chave(email, ex) { return email + '|' + ex; }
  function turma() { return turmas.filter(function (t) { return t.id === turmaId; })[0]; }
  function daTurma() { return alunos.filter(function (a) { return a.turma_id === turmaId; }); }
  function libTurma(exId, tId) { return libs.some(function (l) { return l.exercicio_id === exId && !l.aluno_email && l.turma_id === tId; }); }
  function libIndividual(exId, email) { return libs.some(function (l) { return l.exercicio_id === exId && l.aluno_email === email; }); }
  function liberadoPara(exId, a) { return libIndividual(exId, a.email) || libTurma(exId, a.turma_id); }
  function ehInd(a) { return a && a.tipo === 'individual'; }
  function slug(n) { return String(n || '').trim().split(/\s+/)[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, ''); }
  function sessoesDe(a) { return ehInd(a) ? sessoesTodas.filter(function (s) { return s.processo === a.processo; }) : sessoes; }
  function dataBR(d) { return d ? new Date(d + (d.length === 10 ? 'T12:00:00' : '')).toLocaleDateString('pt-BR') : ''; }
  function acessoAte(a) { var t = turmas.filter(function (x) { return x.id === a.turma_id; })[0]; return a.acesso_ate || (t && t.fim); }
  function hojeISO() { var d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  function maisMeses(iso, m) { var d = new Date(iso + 'T12:00:00'); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); }

  async function carregar() {
    var rs = await Promise.all([
      sb.from('turmas').select('*').order('id'),
      sb.from('alunos').select('*').order('nome'),
      sb.from('sessoes').select('*').order('numero'),
      sb.from('exercicios').select('*').order('sessao').order('ordem'),
      sb.from('liberacoes').select('*'),
      sb.from('respostas').select('*'),
      sb.from('comentarios').select('*'),
      sb.from('anotacoes').select('*'),
      sb.rpc('admin_logins')
    ]);
    for (var i = 0; i < rs.length; i++) if (rs[i].error) throw rs[i].error;
    turmas = rs[0].data; alunos = rs[1].data; sessoesTodas = rs[2].data;
    sessoes = sessoesTodas.filter(function (s) { return !s.processo; }); /* turmas: só as sessões da Mentoria Estrela */ exercicios = rs[3].data; libs = rs[4].data;
    respostas = {}; rs[5].data.forEach(function (r) { respostas[chave(r.aluno_email, r.exercicio_id)] = r; });
    comentarios = {}; rs[6].data.forEach(function (c) { comentarios[chave(c.aluno_email, c.exercicio_id)] = c; });
    anotacoes = {}; rs[7].data.forEach(function (n) { anotacoes[n.aluno_email] = n; });
    logins = {}; rs[8].data.forEach(function (l) { logins[l.email] = l; });
    if (!turmas.some(function (t) { return t.id === turmaId; })) {
      var guard = lerLocal('turma_atual');
      turmaId = turmas.some(function (t) { return t.id === guard; }) ? guard : (turmas.length ? turmas[turmas.length - 1].id : null);
    }
    var sel = $('#selTurma');
    sel.innerHTML = turmas.map(function (t) { return '<option value="' + t.id + '"' + (t.id === turmaId ? ' selected' : '') + '>' + esc(t.nome) + '</option>'; }).join('');
    sel.hidden = !turmas.length;
  }
  async function recarregarRespostas() {
    var r = await sb.from('respostas').select('*');
    if (r.error) return false;
    var mudou = false;
    r.data.forEach(function (x) {
      var k = chave(x.aluno_email, x.exercicio_id);
      if (!respostas[k] || respostas[k].atualizado_em !== x.atualizado_em) { respostas[k] = x; mudou = true; }
    });
    return mudou;
  }

  /* ---------- login ---------- */
  function telaLogin(aviso) {
    $('#abas').hidden = true; $('#bSair').hidden = true; $('#selTurma').hidden = true;
    app.innerHTML = '<form class="cartao" id="f" style="max-width:420px;margin:30px auto"><h2>Entrar no painel</h2>' +
      '<div style="display:grid;gap:8px"><input class="campo-email" style="margin:0" type="email" id="email" required autocomplete="username" placeholder="seu e-mail" value="' + esc(lerLocal('me_email') || '') + '">' +
      '<input class="campo-email" style="margin:0" type="password" id="senha" required autocomplete="current-password" placeholder="senha"><button class="btn">Entrar</button></div>' +
      (aviso ? '<div class="aviso erro">' + aviso + '</div>' : '') + '</form>';
    $('#f').onsubmit = async function (e) {
      e.preventDefault();
      var email = $('#email').value.trim().toLowerCase(); guardarLocal('me_email', email);
      var r = await sb.auth.signInWithPassword({ email: email, password: $('#senha').value.trim() });
      if (r.error) telaLogin(esc(msgErro(r.error))); else iniciar(r.data.session);
    };
  }

  /* ---------- resumo de exercício (compacto) ---------- */
  function ehMaas(e) { return e.conteudo && e.conteudo.componente === 'maas'; }
  function statusEx(a, e) {
    var r = respostas[chave(a.email, e.id)];
    if (!liberadoPara(e.id, a)) return '<span class="pill cinza">não liberado</span>';
    if (ehMaas(e)) {
      if (!r) return '<span class="pill ouro">não iniciada</span>';
      return r.dados.concluido_em ? '<span class="pill verde">concluída</span>' : '<span class="pill">em andamento</span>';
    }
    var p = progresso(e.conteudo, r && r.dados);
    return (p.total && p.feitos >= p.total) ? '<span class="pill verde">respondido</span>' : p.feitos ? '<span class="pill">' + p.feitos + ' de ' + p.total + '</span>' : '<span class="pill ouro">liberado</span>';
  }

  /* ---------- ESPELHO: a tela exata que a pessoa vê, com as respostas dela ----------
     Usa o mesmo código da área do participante (htmlCampos / MAAS.montar / MAAS.resumo),
     então qualquer sessão nova aparece aqui sozinha. Nada é salvo a partir do espelho. */
  var esp = null, espTimer = null;
  function espelhoDom() {
    if ($('#espelho')) return;
    var d = document.createElement('aside'); d.id = 'espelho'; d.hidden = true; d.setAttribute('aria-label', 'Tela do participante');
    d.innerHTML = '<div class="esp-barra"><div class="esp-tit"><b id="espNome"></b><span id="espOnde"></span></div>' +
      '<label class="esp-seguir"><input type="checkbox" id="espSeguir" checked> seguir ao vivo</label>' +
      '<button class="esp-x" id="espFechar" aria-label="Fechar a tela do participante">×</button></div>' +
      '<div class="esp-tela ceu" id="espTela"><div id="espMain"></div></div>';
    document.body.appendChild(d);
    $('#espFechar').onclick = fecharEspelho;
    $('#espSeguir').onchange = function () { if (esp) { esp.seguir = this.checked; if (esp.seguir) esp.passo = null; desenharEspelho(); } };
    $('#espMain').addEventListener('click', function (ev) {
      var l = ev.target.closest('a[href]');
      if (l && l.getAttribute('href').charAt(0) === '#') ev.preventDefault(); /* não muda a página do painel */
    });
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && esp) fecharEspelho(); });
  }
  function abrirEspelho(email, exId) {
    var a = alunos.filter(function (x) { return x.email === email; })[0], e = exercicios.filter(function (x) { return x.id === exId; })[0];
    if (!a || !e) return;
    espelhoDom();
    esp = { a: a, e: e, seguir: true, passo: null, versao: null };
    $('#espSeguir').checked = true;
    $('#espelho').hidden = false; document.body.classList.add('com-espelho');
    desenharEspelho();
    clearInterval(espTimer);
    espTimer = setInterval(async function () {
      if (!esp || document.hidden) return;
      await recarregarRespostas();
      var r = respostas[chave(esp.a.email, esp.e.id)], v = r ? r.atualizado_em : null;
      if (v !== esp.versao) desenharEspelho(true);
    }, 4000);
  }
  function fecharEspelho() {
    clearInterval(espTimer); esp = null;
    var d = $('#espelho'); if (d) d.hidden = true; document.body.classList.remove('com-espelho');
  }
  function desenharEspelho(atualizacao) {
    if (!esp) return;
    var a = esp.a, e = esp.e, r = respostas[chave(a.email, e.id)], c = comentarios[chave(a.email, e.id)];
    var tela = $('#espTela'), main = $('#espMain'), rolagem = tela.scrollTop;
    esp.versao = r ? r.atualizado_em : null;
    var s = sessoesTodas.filter(function (x) { return x.numero === e.sessao; })[0] || { numero: e.sessao, titulo: '' };
    $('#espNome').textContent = (a.nome || a.email) + ' · ' + e.titulo;
    var dados = r ? JSON.parse(JSON.stringify(r.dados)) : null;
    if (ehMaas(e)) {
      var dd = MAAS.completar(e.conteudo, dados || {});
      var onde = MAAS.onde(e.conteudo, r ? dd : null);
      $('#espOnde').textContent = r ? 'está ' + onde.texto + ' · ' + quando(r.atualizado_em) : 'ainda não abriu';
      if (!esp.seguir && esp.passo != null) dd.passo = esp.passo;
      var passoDele = r ? (r.dados.passo || 0) : 0;
      main.innerHTML = '<div id="espMaas"></div>';
      MAAS.montar($('#espMaas'), e, dd, {
        aoDigitar: function () {},
        aoTrocarTela: function () { $('#espTela').scrollTop = 0; },
        salvar: function (x) {
          if (x.passo !== (esp.passo == null ? passoDele : esp.passo)) {
            esp.passo = x.passo; esp.seguir = false; $('#espSeguir').checked = false; /* você virou a página */
          }
        }
      });
    } else if (e.conteudo && e.conteudo.componente === 'resumo') {
      $('#espOnde').textContent = 'página de leitura' + (r ? ' · já abriu' : '');
      main.innerHTML = MAAS.resumo(e.conteudo);
    } else {
      var p = progresso(e.conteudo, dados || {});
      $('#espOnde').textContent = r ? p.feitos + ' de ' + p.total + ' respondidas · ' + quando(r.atualizado_em) : 'ainda não abriu';
      main.innerHTML = '<div class="cabeca" style="padding-bottom:8px"><h1 style="font-size:22px">Sessão ' + (s.exibir || s.numero) + (s.titulo ? ' · ' + esc(s.titulo) : '') + '</h1><div class="sub">' + esc(e.titulo) + '</div></div>' +
        '<div class="folha"><div class="prog" aria-hidden="true"><div style="width:' + (p.total ? Math.round(p.feitos / p.total * 100) : 0) + '%"></div></div>' +
        '<form onsubmit="return false">' + htmlCampos(e.conteudo, dados || {}, false) + '</form></div>';
      prepararFotos(main, { leitura: true });
    }
    if (c && c.texto.trim()) main.insertAdjacentHTML('beforeend', '<div class="comentario"><b>Geovana comentou</b>' + texto(c.texto) + '</div>');
    /* só olhar: nada pode ser digitado aqui */
    $$('input, textarea, select', main).forEach(function (x) { x.disabled = true; });
    $$('.enviar-foto, .apagar-foto', main).forEach(function (x) { x.hidden = true; });
    if (atualizacao) tela.scrollTop = rolagem; else tela.scrollTop = 0;
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-espelho]');
    if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    abrirEspelho(b.getAttribute('data-espelho'), b.getAttribute('data-espex'));
  }, true);

  /* ---------- AULA AO VIVO ---------- */
  function telaVivo() {
    var t = turma();
    if (!t) { app.innerHTML = '<p class="miudo">Crie uma turma primeiro (aba Turmas).</p>'; return; }
    var comEx = sessoes.filter(function (s) { return exercicios.some(function (e) { return e.sessao === s.numero; }); });
    if (!comEx.length) { app.innerHTML = '<h2>Aula ao vivo</h2><p class="miudo">Nenhum exercício cadastrado ainda.</p>'; return; }
    if (!sessaoVivo || !comEx.some(function (s) { return s.numero === sessaoVivo; })) {
      var aberta = comEx.filter(function (s) { return exercicios.some(function (e) { return e.sessao === s.numero && libTurma(e.id, turmaId); }); });
      sessaoVivo = (aberta.length ? aberta[aberta.length - 1] : comEx[0]).numero;
    }
    var h = '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Aula ao vivo · ' + esc(t.nome) + '</h2><span class="vivo">atualiza sozinho</span>' +
      '<select class="sel-sessao" id="selSessao" style="margin-left:auto">' + comEx.map(function (s) { return '<option value="' + s.numero + '"' + (s.numero === sessaoVivo ? ' selected' : '') + '>Sessão ' + s.numero + ' · ' + esc(s.titulo) + '</option>'; }).join('') + '</select></div>';
    h += '<div id="vivoCorpo">' + corpoVivo() + '</div>';
    app.innerHTML = h;
    $('#selSessao').onchange = function () { sessaoVivo = Number(this.value); telaVivo(); };
    ligarVivo();
    clearInterval(vivoTimer);
    vivoTimer = setInterval(async function () {
      if (document.hidden || !$('#vivoCorpo')) return;
      if (await recarregarRespostas()) { $('#vivoCorpo').innerHTML = corpoVivo(); ligarVivo(); }
    }, 6000);
  }
  function corpoVivo() {
    var gente = daTurma(), h = '';
    if (!gente.length) return '<p class="miudo" style="margin-top:12px">Nenhum participante nesta turma ainda.</p>';
    exercicios.filter(function (e) { return e.sessao === sessaoVivo; }).forEach(function (e) {
      var lib = libTurma(e.id, turmaId);
      h += '<div class="vivo-ex"><h3>' + esc(e.titulo) + ' <span class="miudo">· ' + esc(e.tipo) + '</span></h3>' +
        '<button class="btn peq ' + (lib ? 'leve' : '') + '" data-libvivo="' + esc(e.id) + '" data-on="' + (lib ? 0 : 1) + '">' + (lib ? '✓ liberado · bloquear' : 'Liberar para a turma') + '</button></div>';
      h += '<div class="vivo-grade">';
      gente.forEach(function (a) {
        var r = respostas[chave(a.email, e.id)], corpo = '';
        if (ehMaas(e) && r) {
          var d = MAAS.completar(e.conteudo, JSON.parse(JSON.stringify(r.dados))), o = MAAS.onde(e.conteudo, d);
          corpo = MAAS.radar(d.notas, { tamanho: 200, mini: true, destaque: o.pilar }) +
            '<div class="st" style="text-align:center">' + esc(o.texto) + '</div>';
        } else if (r) {
          corpo = '<div class="res">' + camposResumo(e, r.dados) + '</div>';
        }
        h += '<a class="vivo-card" href="#p=' + encodeURIComponent(a.email) + '"><div class="nome">' + esc(a.nome || a.email) + '</div>' +
          '<div class="st">' + statusEx(a, e) + (r ? ' · ' + quando(r.atualizado_em) : '') + '</div>' + corpo +
          '<span class="esp-mini" role="button" tabindex="0" data-espelho="' + esc(a.email) + '" data-espex="' + esc(e.id) + '">📱 ver a tela</span></a>';
      });
      h += '</div>';
    });
    return h;
  }
  function camposResumo(e, dados) {
    return camposRespondiveis(e.conteudo).map(function (c) {
      var v = dados[c.id];
      if (!preenchido(v)) return '';
      if (c.tipo === 'foto') v = (v.length || 0) + ' foto(s)';
      return '<p><b>' + esc(c.rotulo) + '</b><br>' + esc(Array.isArray(v) ? v.filter(preenchido).join(', ') : v) + '</p>';
    }).join('') || '<span class="vazio">começou a responder</span>';
  }
  function ligarVivo() {
    $$('[data-libvivo]').forEach(function (b) {
      b.onclick = async function () {
        b.disabled = true;
        await alternarTurma(b.getAttribute('data-libvivo'), b.getAttribute('data-on') === '1');
        $('#vivoCorpo').innerHTML = corpoVivo(); ligarVivo();
      };
    });
  }

  /* ---------- PARTICIPANTES ---------- */
  function resumoAluno(a) {
    var lib = exercicios.filter(function (e) { return liberadoPara(e.id, a); });
    var feitos = 0, ultima = null;
    lib.forEach(function (e) {
      var r = respostas[chave(a.email, e.id)];
      if (!r) return;
      var p = progresso(e.conteudo, r.dados);
      if (p.total && p.feitos >= p.total) feitos++;
      if (!ultima || r.atualizado_em > ultima) ultima = r.atualizado_em;
    });
    return { lib: lib.length, feitos: feitos, ultima: ultima };
  }
  function telaAlunos() {
    var t = turma(), gente = daTurma();
    var h = '<h2>Participantes · ' + esc(t ? t.nome : '') + ' <span class="pill cinza" style="font:500 13px Jost">' + gente.length + '</span></h2>';

  async function cadastrar(nome, email, senha, tId) {
    if (senha.length < 6) return { ok: false, erro: 'A senha precisa ter pelo menos 6 caracteres.' };

    if (tId === 'individual') { linha.tipo = 'individual'; linha.processo = slug(nome); linha.turma_id = null; }

    var r = await sb.from('alunos').upsert(linha, { onConflict: 'email' });
    if (r.error) return { ok: false, erro: msgErro(r.error) };
    if (logins[email]) {
      var t = await sb.rpc('admin_trocar_senha', { p_email: email, p_senha: senha });
      return t.error ? { ok: false, erro: msgErro(t.error) } : { ok: true };
    }
    var su = await tmp.auth.signUp({ email: email, password: senha });
    if (su.error && /already/i.test(su.error.message)) {
      var t2 = await sb.rpc('admin_trocar_senha', { p_email: email, p_senha: senha });
      return t2.error ? { ok: false, erro: msgErro(t2.error) } : { ok: true };
    }
    if (su.error) return { ok: false, erro: msgErro(su.error) };
    if (su.data && !su.data.session) return { ok: false, erro: 'O Supabase está pedindo confirmação por e-mail. Desligue "Confirm email" em Authentication → Sign In / Providers → Email e cadastre de novo.' };

      if (!exs.length) return;
      var todos = exs.every(function (e) { return libTurma(e.id, turmaId); });
      h += '<tr class="sess"><td>Sessão ' + s.numero + ' · ' + esc(s.titulo) + '</td><td class="turma"><button class="btn peq ' + (todos ? 'leve' : '') + ' bSessao" data-s="' + s.numero + '" data-on="' + (todos ? '0' : '1') + '">' + (todos ? 'bloquear sessão' : 'liberar sessão') + '</button></td><td colspan="' + gente.length + '"></td></tr>';
      exs.forEach(function (e) {
        var tl = libTurma(e.id, turmaId);
        h += '<tr><td>' + esc(e.titulo) + ' <span class="miudo">· ' + esc(e.tipo) + '</span></td><td class="turma"><input type="checkbox" class="cbT" data-ex="' + esc(e.id) + '"' + (tl ? ' checked' : '') + ' aria-label="Turma: ' + esc(e.titulo) + '"></td>';
        gente.forEach(function (a) {
          h += '<td><input type="checkbox" class="cbA" data-ex="' + esc(e.id) + '" data-a="' + esc(a.email) + '"' + (tl || libIndividual(e.id, a.email) ? ' checked' : '') + (tl ? ' disabled title="liberado para a turma"' : '') + ' aria-label="' + esc(a.nome) + ': ' + esc(e.titulo) + '"></td>';
        });
        h += '</tr>';
      });
    });
    app.innerHTML = h + '</tbody></table></div>';
    $$('.cbT').forEach(function (cb) { cb.onchange = async function () { cb.disabled = true; await alternarTurma(cb.getAttribute('data-ex'), cb.checked); telaLiberar(); }; });
    $$('.cbA').forEach(function (cb) {
      cb.onchange = async function () {
        cb.disabled = true;
        var id = cb.getAttribute('data-ex'), em = cb.getAttribute('data-a');
        var r = cb.checked ? await sb.from('liberacoes').insert({ exercicio_id: id, aluno_email: em }) : await sb.from('liberacoes').delete().eq('exercicio_id', id).eq('aluno_email', em);
        if (r.error) toast(msgErro(r.error));
        var l = await sb.from('liberacoes').select('*'); if (!l.error) libs = l.data;
        telaLiberar();
      };
    });
    $$('.bSessao').forEach(function (b) {
      b.onclick = async function () {
        b.disabled = true;
        var n = Number(b.getAttribute('data-s')), on = b.getAttribute('data-on') === '1';
        var ids = exercicios.filter(function (e) { return e.sessao === n; }).map(function (e) { return e.id; });
        var r = on ? await sb.from('liberacoes').insert(ids.filter(function (id) { return !libTurma(id, turmaId); }).map(function (id) { return { exercicio_id: id, turma_id: turmaId }; }))
                   : await sb.from('liberacoes').delete().in('exercicio_id', ids).eq('turma_id', turmaId).is('aluno_email', null);
        if (r.error) toast(msgErro(r.error)); else toast(on ? 'Sessão liberada ✓' : 'Sessão bloqueada');
        var l = await sb.from('liberacoes').select('*'); if (!l.error) libs = l.data;
        telaLiberar();
      };
    });
  }

  /* ---------- TURMAS ---------- */
  function telaTurmas() {
    var h = '<h2>Turmas</h2><p class="miudo" style="margin-bottom:12px">Cada participante só vê a própria turma. O acesso termina sozinho na data de fim (padrão: 5 meses depois do início). Para alguém continuar, use "Renovar" na página da pessoa.</p>';
    turmas.forEach(function (t) {
      var n = alunos.filter(function (a) { return a.turma_id === t.id; }).length;
      h += '<div class="cartao"><div class="form-linha" style="align-items:center"><input data-tn="' + t.id + '" value="' + esc(t.nome) + '">' +
        '<label class="miudo">início <input type="date" data-ti="' + t.id + '" value="' + t.inicio + '"></label>' +
        '<label class="miudo">fim do acesso <input type="date" data-tf="' + t.id + '" value="' + t.fim + '"></label>' +
        '<button class="btn peq" data-ts="' + t.id + '">Salvar</button></div><p class="miudo" style="margin-top:6px">' + n + ' participante' + (n === 1 ? '' : 's') + (t.fim < hojeISO() ? ' · <b>acesso encerrado</b>' : '') + '</p></div>';
    });
    var hoje = hojeISO();
    h += '<form class="cartao" id="fTurma"><h3 style="margin-bottom:8px">Nova turma</h3><div class="form-linha" style="align-items:center"><input id="tNome" required placeholder="Turma ' + (turmas.length + 1) + '" value="Turma ' + (turmas.length + 1) + '">' +
      '<label class="miudo">início <input type="date" id="tIni" value="' + hoje + '"></label><label class="miudo">fim <input type="date" id="tFim" value="' + maisMeses(hoje, 5) + '"></label><button class="btn">Criar turma</button></div></form>';
    app.innerHTML = h;
    $('#tIni').onchange = function () { $('#tFim').value = maisMeses(this.value, 5); };
    $$('[data-ts]').forEach(function (b) {
      b.onclick = async function () {
        var id = Number(b.getAttribute('data-ts'));
        var r = await sb.from('turmas').update({ nome: $('[data-tn="' + id + '"]').value.trim(), inicio: $('[data-ti="' + id + '"]').value, fim: $('[data-tf="' + id + '"]').value }).eq('id', id);
        if (r.error) { toast(msgErro(r.error)); return; }
        toast('Turma salva ✓'); await carregar(); telaTurmas();
      };
    });
    $('#fTurma').onsubmit = async function (e) {
      e.preventDefault();
      var r = await sb.from('turmas').insert({ nome: $('#tNome').value.trim(), inicio: $('#tIni').value, fim: $('#tFim').value }).select().single();
      if (r.error) { toast(msgErro(r.error)); return; }
      turmaId = r.data.id; guardarLocal('turma_atual', turmaId);
      toast('Turma criada ✓'); await carregar(); telaTurmas();
    };
  }

  /* ---------- rotas ---------- */
  function rota() {
    clearInterval(vivoTimer);
    var hsh = location.hash, aba = 'alunos', m = hsh.match(/^#p=(.+)$/);
    if (hsh === '#aovivo') { aba = 'aovivo'; telaVivo(); }
    else if (hsh === '#liberar') { aba = 'liberar'; telaLiberar(); }
    else if (hsh === '#turmas') { aba = 'turmas'; telaTurmas(); }
    else if (m) { aba = ''; telaAluno(decodeURIComponent(m[1])); }
    else telaAlunos();
    $$('#abas a').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-aba') === aba); });
    window.scrollTo(0, 0);
  }
  function temRascunho() {
    return $$('.caixa-com textarea, #anotTexto').some(function (t) { return t.dataset.sujo === '1'; });
  }
  window.addEventListener('hashchange', async function () {
    try { await carregar(); } catch (e) {}
    rota();
  });
  window.addEventListener('beforeunload', function (e) { if (temRascunho()) { e.preventDefault(); e.returnValue = ''; } });
  $('#selTurma').onchange = function () { turmaId = Number(this.value); guardarLocal('turma_atual', turmaId); if (/^#p=/.test(location.hash)) location.hash = ''; else rota(); };

  var iniciado = false;
  async function iniciar(s) {
    if (iniciado) return; iniciado = true;
    $('#bSair').hidden = false;
    $('#bSair').onclick = async function () { await sb.auth.signOut(); iniciado = false; location.hash = ''; telaLogin(); };
    var a = await sb.rpc('eh_admin');
    if (!a.data) {
      app.innerHTML = '<div class="cartao" style="max-width:460px;margin:30px auto"><h2>Sem acesso ao painel</h2><p>Você entrou como <b>' + esc(s.user.email) + '</b>, que não é administradora. <a href="./">Ir para a área do participante</a>.</p></div>';
      return;
    }
    $('#abas').hidden = false;
    try { await carregar(); if (!location.hash) location.hash = '#aovivo'; else rota(); }
    catch (err) { app.innerHTML = '<div class="cartao"><p>' + esc(msgErro(err)) + '</p><p class="miudo">Se a mensagem fala de "turmas" ou "anotacoes", rode de novo o arquivo SQL atualizado no Supabase.</p><button class="btn" onclick="location.reload()">Tentar de novo</button></div>'; }
  }
  sb.auth.getSession().then(function (r) { if (r.data.session) iniciar(r.data.session); else telaLogin(); });
  sb.auth.onAuthStateChange(function (ev, s) { if (ev === 'SIGNED_IN' && s) iniciar(s); });
})();
</script>
</body>
</html>
